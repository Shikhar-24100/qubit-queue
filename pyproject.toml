[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qubit-queue"
version = "0.1.0"
description = "A simulator-first quantum workload job scheduler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "redis>=5,<7", "rq>=2.1,<3",
  "qiskit>=2.0,<3", "qiskit-aer>=0.17,<0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fakeredis>=2.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
